{% extends 'base.html' %}

{% block title %}Edit task | CanvasGPT{% endblock %}

{% block content %}
<section class="content-card">
    <p><a href="{% url 'canvas_sync:assignment_detail' assignment.pk %}">← Back to {{ assignment.title }}</a></p>
    <h1>Edit task</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save task</button>
    </form>
</section>
{% endblock %}
