<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CanvasGPT{% endblock %}</title>
    <style>
        :root {
            --bg: #f7f8fc;
            --text: #172033;
            --muted: #5e6a7d;
            --primary: #335cff;
            --primary-dark: #2547cc;
            --card: #ffffff;
            --card-translucent: rgba(255, 255, 255, 0.86);
            --surface-translucent: rgba(255, 255, 255, 0.72);
            --input-bg: #ffffff;
            --border: #e1e6f0;
            --shadow: rgba(23, 32, 51, 0.1);
            --page-glow: #dfe7ff;
        }

        body.dark-mode {
            --bg: #0f172a;
            --text: #e5e7eb;
            --muted: #a7b0c0;
            --primary: #7c9cff;
            --primary-dark: #a8bcff;
            --card: #111827;
            --card-translucent: rgba(17, 24, 39, 0.9);
            --surface-translucent: rgba(30, 41, 59, 0.82);
            --input-bg: #1f2937;
            --border: #334155;
            --shadow: rgba(0, 0, 0, 0.32);
            --page-glow: #1e3a8a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: radial-gradient(circle at top left, var(--page-glow) 0, transparent 32rem), var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a { color: var(--primary-dark); font-weight: 700; }

        .site-shell {
            width: min(1120px, calc(100% - 2rem));
            margin: 0 auto;
            padding: 2rem 0 4rem;
        }

        .site-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 4rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text);
            font-size: 1.4rem;
            font-weight: 800;
            text-decoration: none;
        }

        .logo {
            display: grid;
            place-items: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.8rem;
            color: white;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            box-shadow: 0 0.75rem 1.75rem rgba(51, 92, 255, 0.25);
        }

        .nav-actions, .form-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .button, button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.75rem;
            padding: 0.75rem 1.1rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text);
            background: var(--surface-translucent);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .button:hover, button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0.75rem 1.5rem rgba(23, 32, 51, 0.08);
        }

        .button.primary, button.primary {
            border-color: var(--primary);
            color: white;
            background: var(--primary);
        }

        .button.primary:hover, button.primary:hover { background: var(--primary-dark); }

        .content-card {
            width: min(100%, 40rem);
            margin: 0 auto;
            padding: clamp(1.5rem, 4vw, 2.5rem);
            border: 1px solid var(--border);
            border-radius: 2rem;
            background: var(--card-translucent);
            box-shadow: 0 1.5rem 4rem var(--shadow);
            backdrop-filter: blur(10px);
        }

        h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -0.05em; }
        h2 { margin-top: 0; }
        p { color: var(--muted); line-height: 1.6; }

        form p { margin: 1rem 0; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 700; }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            background: var(--input-bg);
            font: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: 3px solid rgba(124, 156, 255, 0.35); border-color: var(--primary); }
        input[type="checkbox"] { width: auto; }
        .helptext, .errorlist { color: var(--muted); font-size: 0.9rem; }
        .errorlist { padding-left: 1.2rem; color: #b42318; }

        fieldset { margin: 1.5rem 0; padding: 1.25rem; border: 1px solid var(--border); border-radius: 1rem; }
        legend { padding: 0 0.5rem; font-weight: 800; }

        .content-card.wide { width: min(100%, 56rem); }
        .metadata-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin: 1.5rem 0; }
        .metadata-item, .rubric-item, .assignment-row, .sync-status { padding: 1rem; border: 1px solid var(--border); border-radius: 1rem; background: var(--surface-translucent); }
        .metadata-label { display: block; margin-bottom: 0.35rem; color: var(--muted); font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
        .description-block { margin: 1.5rem 0; padding: 1rem; border: 1px solid var(--border); border-radius: 1rem; background: var(--input-bg); }
        .rubric-list, .assignment-list { display: grid; gap: 1rem; margin: 1rem 0 0; padding: 0; list-style: none; }
        .assignment-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .sync-status.success { border-color: #34a853; background: rgba(52, 168, 83, 0.14); }
        .sync-status.warning { border-color: #f4c46a; background: rgba(244, 196, 106, 0.18); }
        .sync-status.error { border-color: #f4a3a3; background: rgba(244, 163, 163, 0.18); }
        .sync-status strong { display: block; margin-bottom: 0.35rem; }

        @media (max-width: 640px) {
            .site-nav { align-items: flex-start; flex-direction: column; margin-bottom: 2.5rem; }
        }
    </style>
</head>
<body{% if user.is_authenticated and user.student_profile.dark_mode_enabled %} class="dark-mode"{% endif %}>
    <div class="site-shell">
        <header class="site-nav">
            <a class="brand" href="{% url 'home' %}">
                <span class="logo">CG</span>
                <span>CanvasGPT</span>
            </a>
            <nav class="nav-actions" aria-label="Primary navigation">
                {% if user.is_authenticated %}
                    <span>Signed in as {{ user.username }}</span>
                    <a class="button" href="{% url 'accounts:profile' %}">Profile</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit">Log out</button>
                    </form>
                {% else %}
                    <a class="button" href="{% url 'accounts:login' %}">Login</a>
                {% endif %}
            </nav>
        </header>
        <main>{% block content %}{% endblock %}</main>
    </div>
</body>
</html>
